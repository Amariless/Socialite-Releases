name: Download links

# Points the download buttons in the README at the files of each new release.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Update the README
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VER="${TAG#v}"
          sed -i -E "s#(releases/download/)[^/]+/([A-Za-z-]+[-_])[0-9]+(\.[0-9]+)+([-_.])#\1${TAG}/\2${VER}\4#g" README.md
          git diff --quiet && exit 0
          git config user.name "Amariles"
          git config user.email "alejoama2005@gmail.com"
          git commit -am "Download links for $TAG"
          git push
